<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نوفا الجمال — الإعداد الأولي</title>
<style>
  :root {
    --font-body: "Segoe UI", Tahoma, "Segoe UI Arabic", Arial, sans-serif;
    --color-primary: #6E2A55; --color-primary-tint: #F6E8F0; --color-accent: #C03A72; --color-gold: #A8741A;
    --color-bg-page: #FAF5F7; --color-surface: #FFFFFF; --color-surface-2: #FCF8FA; --color-border: #F0E2E9; --color-border-strong: #E0C9D4;
    --color-text: #2B1B26; --color-text-secondary: #77626F; --color-text-muted: #A691A0; --color-danger: #C0362C; --color-danger-tint: #FCE8E6;
    --shadow-lg: 0 24px 54px -18px rgba(110,42,85,.38), 0 6px 14px rgba(110,42,85,.08);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --color-primary: #E6A9CB; --color-primary-tint: #35202F; --color-accent: #F0719F; --color-gold: #E5BC62;
    --color-bg-page: #150E14; --color-surface: #1F161E; --color-surface-2: #281D27; --color-border: #3A2B39; --color-border-strong: #4C3949;
    --color-text: #F8EEF3; --color-text-secondary: #CDB6C4; --color-text-muted: #988294; --color-danger: #F1786D; --color-danger-tint: #3A1512;
  } }
  :root[data-theme="dark"] {
    --color-primary: #E6A9CB; --color-primary-tint: #35202F; --color-accent: #F0719F; --color-gold: #E5BC62;
    --color-bg-page: #150E14; --color-surface: #1F161E; --color-surface-2: #281D27; --color-border: #3A2B39; --color-border-strong: #4C3949;
    --color-text: #F8EEF3; --color-text-secondary: #CDB6C4; --color-text-muted: #988294; --color-danger: #F1786D; --color-danger-tint: #3A1512;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: var(--font-body); color: var(--color-text); direction: rtl; line-height: 1.6;
    background: radial-gradient(900px 420px at 100% 0%, color-mix(in srgb, var(--color-accent) 10%, transparent), transparent 70%),
                radial-gradient(760px 380px at 0% 100%, color-mix(in srgb, var(--color-gold) 10%, transparent), transparent 70%), var(--color-bg-page);
    display: flex; flex-direction: column; align-items: center; padding: 30px 16px; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-gold) 55%, transparent), var(--shadow-lg); background: #fff; }
  .brand h1 { margin: 12px 0 2px; font-size: 24px; font-weight: 800; }
  .brand p { margin: 0; color: var(--color-text-secondary); font-size: 13.5px; }
  .card { width: 100%; max-width: 640px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-lg); }
  h2 { margin: 22px 0 10px; font-size: 15px; font-weight: 800; }
  h2:first-of-type { margin-top: 0; }
  h2::before { content: ''; display: inline-block; width: 4px; height: 15px; margin-inline-end: 9px; vertical-align: -2px; border-radius: 3px; background: linear-gradient(180deg, #E7C278, var(--color-accent)); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  input, select { width: 100%; font: inherit; font-size: 13.5px; padding: 11px 13px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); }
  input:focus, select:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 20%, transparent); }
  .ltr { direction: ltr; text-align: left; }
  .hint { font-size: 11.5px; color: var(--color-text-muted); margin-top: 4px; }
  .err { display: none; margin: 8px 0; padding: 11px 13px; border-radius: 12px; background: var(--color-danger-tint); color: var(--color-danger); font-size: 13px; font-weight: 700; }
  .btn { width: 100%; margin-top: 10px; font: inherit; font-weight: 800; font-size: 15px; border: 0; cursor: pointer; border-radius: 12px; padding: 13px; color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--color-accent) 90%, #fff), var(--color-accent)); box-shadow: 0 12px 24px -12px var(--color-accent); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  @media (max-width: 620px) { .row { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="brand">
    <img src="/branding/icon-256.png" alt="">
    <h1>أهلاً بكِ في نوفا الجمال</h1>
    <p>أدخلي بيانات منشأتك وحساب المديرة لبدء استخدام النظام</p>
  </div>
  <div class="card">
    <h2>بيانات المنشأة</h2>
    <div class="row">
      <div class="field"><label for="shop">اسم المنشأة *</label><input id="shop" placeholder="مثال: صالون ..." autocomplete="off"></div>
      <div class="field"><label for="phone">رقم الهاتف</label><input id="phone" class="ltr" placeholder="09XXXXXXXX"></div>
    </div>
    <div class="row">
      <div class="field"><label for="cur">العملة</label>
        <select id="cur">
          <option value="SDG|ج.س">جنيه سوداني (ج.س)</option><option value="SAR|ر.س">ريال سعودي (ر.س)</option>
          <option value="EGP|ج.م">جنيه مصري (ج.م)</option><option value="AED|د.إ">درهم إماراتي (د.إ)</option>
          <option value="QAR|ر.ق">ريال قطري (ر.ق)</option><option value="KWD|د.ك">دينار كويتي (د.ك)</option>
          <option value="USD|$">دولار أمريكي ($)</option><option value="EUR|€">يورو (€)</option>
        </select></div>
      <div></div>
    </div>

    <h2>حساب المديرة</h2>
    <div class="row">
      <div class="field"><label for="name">الاسم الكامل *</label><input id="name" autocomplete="off"></div>
      <div class="field"><label for="user">اسم المستخدم * (للدخول)</label><input id="user" class="ltr" autocomplete="off" placeholder="admin"><div class="hint">حروف إنجليزية وأرقام فقط</div></div>
    </div>
    <div class="row">
      <div class="field"><label for="pass">كلمة المرور * (8 أحرف على الأقل)</label><input id="pass" type="password" class="ltr" autocomplete="new-password"></div>
      <div class="field"><label for="pass2">تأكيد كلمة المرور *</label><input id="pass2" type="password" class="ltr" autocomplete="new-password"></div>
    </div>

    <h2>سؤال الأمان (لاستعادة كلمة المرور)</h2>
    <div class="row">
      <div class="field"><label for="q">السؤال</label>
        <select id="q"><option>اسم أول محل عملتِ فيه؟</option><option>ما اسم أفضل صديقة لك في الطفولة؟</option><option>ما هو لونك المفضل؟</option><option>ما اسم مدينة ميلادك؟</option><option>ما اسم حيوانك الأليف الأول؟</option></select></div>
      <div class="field"><label for="a">الإجابة</label><input id="a" autocomplete="off"></div>
    </div>

    <div class="err" id="err"></div>
    <button class="btn" id="go" type="button">إنشاء الحساب والبدء</button>
  </div>
<script src="shared.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function fail(m) { $('err').textContent = m; $('err').style.display = 'block'; }
    $('go').addEventListener('click', async function () {
      var btn = this; $('err').style.display = 'none';
      var shop = $('shop').value.trim(), name = $('name').value.trim(), user = $('user').value.trim(), p1 = $('pass').value, p2 = $('pass2').value;
      if (!shop || !name || !user) return fail('أكملي الحقول المطلوبة (*)');
      if (!/^[A-Za-z0-9_.-]{3,30}$/.test(user)) return fail('اسم المستخدم: 3 إلى 30 حرفاً إنجليزياً أو أرقاماً');
      if (p1.length < 8) return fail('كلمة المرور يجب ألا تقل عن 8 أحرف');
      if (p1 !== p2) return fail('كلمتا المرور غير متطابقتين');
      var cur = $('cur').value.split('|');
      btn.setAttribute('disabled', 'true');
      try {
        await BH.api('/api/setup', { method: 'POST', body: {
          shop_name: shop, phone: $('phone').value.trim(), currency_code: cur[0], currency_label: cur[1],
          name: name, username: user, password: p1,
          security_question: $('q').value, security_answer: $('a').value.trim()
        } });
        await BH.api('/api/auth/login', { method: 'POST', body: { username: user, password: p1 } });
        window.location.href = 'dashboard.html';
      } catch (e) { fail(e.message); btn.removeAttribute('disabled'); }
    });
  })();
</script>
</body>
</html>
